<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dealer System</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0f1b2d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Dealer">
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#132033;--mut:#62708a;--line:#e1e6ee;--acc:#1b5cff;--acc2:#e8efff;--ok:#0d8a4e;--okb:#e3f6ec;--warn:#a85a00;--warnb:#fff2df;--bad:#c42b2b;--badb:#fde9e9;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:30;background:#0f1b2d;color:#fff;padding-top:env(safe-area-inset-top)}
header .in{max-width:1180px;margin:0 auto;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.brand{font-weight:800;font-size:16px;flex:1;min-width:140px}.brand small{display:block;font-weight:500;color:#9db0cf;font-size:12px}
header select{background:#1c2c45;border:1px solid #2f4466;color:#fff;border-radius:8px;padding:6px 8px;max-width:180px}
nav{max-width:1180px;margin:0 auto;padding:0 12px 8px;display:flex;flex-wrap:wrap;gap:6px}
nav a{color:#c9d6ec;text-decoration:none;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:600;background:#17263d}
nav a.on{background:var(--acc);color:#fff}
main{max-width:1180px;margin:0 auto;padding:12px 12px 80px}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:16px;margin:16px 0 8px}h3{font-size:14px;margin:12px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.bar .grow{flex:1;min-width:160px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}.tile b{display:block;font-size:20px;margin-top:2px}.tile span{color:var(--mut);font-size:12px;font-weight:600}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;display:block;color:inherit;text-decoration:none}
.item:hover{border-color:#b9c6dc}.item .t{font-weight:700}.item .s{color:var(--mut);font-size:13px;margin-top:2px}
.row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}.kv:last-child{border:0}.kv span{color:var(--mut)}.kv b,.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#eef1f6;color:#3b4a63;white-space:nowrap}
.chip.ok{background:var(--okb);color:var(--ok)}.chip.warn{background:var(--warnb);color:var(--warn)}.chip.bad{background:var(--badb);color:var(--bad)}.chip.acc{background:var(--acc2);color:var(--acc)}
.f{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
label.l{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--mut)}
label.l.wide{grid-column:1/-1}
input,select,textarea{border:1px solid #cdd5e1;border-radius:9px;padding:9px 10px;background:#fff;width:100%;min-width:0}
textarea{min-height:70px}
input[type=checkbox]{width:auto}
.btn{border:0;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--acc);color:#fff}
.btn.sec{background:#e7ecf4;color:#1d2b44}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.mut{color:var(--mut)}.small{font-size:12px}.right{text-align:right}
.sub{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#fafbfd}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}.tbl th{font-size:12px;color:var(--mut);text-align:left}.tbl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.tabs a{padding:6px 12px;border-radius:999px;background:#e7ecf4;color:#1d2b44;text-decoration:none;font-weight:600;font-size:13px;cursor:pointer}.tabs a.on{background:var(--ink);color:#fff}
 @media (max-width:640px){.tbl.stack tr:first-child{display:none}.tbl.stack tr{display:block;border-bottom:1px solid var(--line);padding:6px 0}.tbl.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:2px 0;text-align:right}.tbl.stack td::before{content:attr(data-l);color:var(--mut);font-size:12px;font-weight:700;text-align:left}.tbl.stack td:empty{display:none}.tbl.stack td.n{white-space:normal}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#132033;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;display:none;max-width:92vw}
#toast.err{background:var(--bad)}
.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 0 6px;display:flex;flex-wrap:wrap;gap:8px}
.calc{background:#0f1b2d;color:#fff;border-radius:var(--r);padding:12px}.calc .kv{border-color:#2a3b57}.calc .kv span{color:#9db0cf}
.photos{display:flex;flex-wrap:wrap;gap:6px}.photos img{width:84px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.insp-green{border-left:4px solid var(--ok)}.insp-yellow{border-left:4px solid #e3a500}.insp-red{border-left:4px solid var(--bad)}
@media print{header,nav,.bar,.sticky,.noprint,#toast{display:none!important}body{background:#fff}main{padding:0}.card{border:0}}
.print-only{display:none}@media print{.print-only{display:block}}
</style>
</head>
<body>
<header><div class="in"><div class="brand" id="brand">Dealer System<small id="who"></small></div>
<select id="storePick" title="Store"></select>
<button class="btn sec sm" onclick="logout()">Sign out</button></div>
<nav id="nav"></nav></header>
<main id="main"><p class="mut">Loading…</p></main>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
