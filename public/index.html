<script>
/* ================= constants ================= */
const STATUSES=['Estimate','Sent','Approved','In Progress','Invoiced','Paid','Lost'];
const PHASES=['Discovery','Design','Build','Integrations','Launch','Other'];
const CX=[[0.85,'Simple (×0.85)'],[1,'Standard (×1.0)'],[1.25,'Complex (×1.25)'],[1.5,'Rush / high-risk (×1.5)']];
const MOD_DESC={
 'Discovery & requirements meetings':'Kickoff and follow-up meetings to confirm goals, users, workflows and must-have features.',
 'Project plan & technical spec':'Written plan covering screens, data, integrations, hosting and milestones, approved before the build starts.',
 'UI/UX wireframes & mockups':'Layouts and clickable mockups of the main screens for phone and desktop, with up to 2 revision rounds.',
 'Branding / logo & color setup':'Apply the client’s logo, colors and fonts across the app.',
 'Phone-first responsive layout':'Every screen works on phones, tablets and desktops, with no sideways scrolling.',
 'Database design & setup':'Database tables for the app’s data, with backups and room to grow.',
 'User login, roles & security':'Secure sign-in, password reset, user roles (e.g. admin, staff) and permission checks on every page.',
 'Admin dashboard':'Admin area to manage users, records and settings, with search and edit tools.',
 'Customer / client portal':'Logged-in area where customers view their own records, status and documents.',
 'Forms & data intake':'Online forms with validation that save straight into the database.',
 'Search, filters & sorting':'Find records fast with search, filters and sortable lists.',
 'Reports & dashboards':'Summary dashboards and reports with key numbers, date ranges and export.',
 'PDF / document generation':'Generate branded PDFs (e.g. invoices, agreements, summaries) from app data.',
 'File & photo uploads':'Upload, store and view files and photos attached to records.',
 'Email notifications':'Automatic emails for key events (sign-ups, status changes, reminders).',
 'Calendar / scheduling':'Calendar view with booking, rescheduling and reminders.',
 'Inventory / product catalog':'Product or inventory list with categories, photos, pricing and stock levels.',
 'Data import / migration':'Import existing data from spreadsheets or the old system, cleaned and checked.',
 'AI features (chat, summaries, OCR)':'AI tools such as chat help, automatic summaries or reading text from documents/photos.',
 'Marketing website (up to 5 pages)':'Public website, up to 5 pages, with contact form and basic SEO.',
 'Payments (Stripe / Square)':'Online card payments with receipts, refunds and payment records.',
 'Third-party API integration':'Connect to one outside system to send or receive data automatically.',
 'SMS / text alerts':'Text message alerts for key events.',
 'Email inbox parsing / import':'Read incoming emails and turn them into records automatically.',
 'Google / Microsoft sign-in':'Sign in with Google or Microsoft accounts.',
 'Testing & QA (phone + desktop)':'Test every screen and feature on phones and computers, and fix issues before launch.',
 'Hosting, deploy, domain & SSL setup':'Set up hosting, the database, the domain and SSL (https), then launch the app.',
 'Training & user guide':'Walkthrough training session and a short written user guide.',
 'Launch support (first 2 weeks)':'Priority fixes and help for the first two weeks after launch.'};
const scopeOf=l=>(l.scope&&l.scope.trim())||MOD_DESC[l.desc]||'';
const MOD_CATS=['Hosting','Database','Domain','Email','Support','API / AI','Software','Other'];
const MODS=[
 ['Discovery','Discovery & requirements meetings',4,'pm'],
 ['Discovery','Project plan & technical spec',6,'dev'],
 ['Design','UI/UX wireframes & mockups',12,'des'],
 ['Design','Branding / logo & color setup',4,'des'],
 ['Design','Phone-first responsive layout',8,'des'],
 ['Build','Database design & setup',6,'dev'],
 ['Build','User login, roles & security',10,'dev'],
 ['Build','Admin dashboard',16,'dev'],
 ['Build','Customer / client portal',20,'dev'],
 ['Build','Forms & data intake',8,'dev'],
 ['Build','Search, filters & sorting',6,'dev'],

 ['Build','File & photo uploads',6,'dev'],

 ['Web app hosting (Render Starter)','Hosting',7,'mo','mk'],

const escBr=s=>esc(s).replace(/\n/g,'<br>');

/* ================= state ================= */

 rates:[{id:'dev',name:'Developer',rate:125},{id:'des',name:'UI/UX Design',rate:95},{id:'pm',name:'Project Management',rate:85}],
 d:{contingency:10,deposit:50,tax:0,terms:15,markup:30,hpw:25,trackAllow:25,warranty:30,invPrefix:'INV-',nextInv:1001,estValid:30,cancelDays:30,lateFee:1.5,law:'Texas',venue:'Hidalgo County, Texas',licCap:5,near:'McAllen, TX'},
 oos:DEF_OOS,assume:DEF_ASSUME,resp:DEF_RESP}}

 client:{name:'',company:'',email:'',phone:'',address:''},name:'New App Build',desc:'',start:'',launch:'',

 invoice:{number:'',date:iso(),due:'',mode:'fixed',changeOrders:[],payments:[],credit:0,tax:d.tax,notes:'Thank you for your business!'},

 ['lines'].forEach(k=>{if(!Array.isArray(p[k]))p[k]=[]});['timeline','schedule'].forEach(k=>{if(!Array.isArray(p.sow[k]))p.sow[k]=[]});['changeOrders','payments'].forEach(k=>{if(!Array.isArray(p.invoice[k]))p.invoice[k]=[]});if(!Array.isArray(p.monthly.items))p.monthly.items=[];if(!Array.isArray(p.links))p.links=[];if(!Array.isArray(p.comps))p.comps=[];p.lic={...n.lic,...(p.lic||{})};if(!Array.isArray(p.lic.items))p.lic.items=[];return p}

/* ================= calculations ================= */
function calcEst(p){let labor=0,hrs=0,exp=0;const cx=num(p.complexity)||1;
 const lines=p.lines.map(l=>{let a;if(l.type==='exp'){a=num(l.qty)*num(l.cost);exp+=a}else{a=num(l.hours)*num(l.rate);labor+=a;hrs+=num(l.hours)}return a});
 const laborAdj=labor*cx,cont=laborAdj*num(p.contingency)/100,sub=laborAdj+cont+exp,disc=p.discType==='amt'?Math.min(num(p.discount),sub):sub*num(p.discount)/100,total=sub-disc;
 const low=Math.max(0,laborAdj+exp-disc);
 return{lines,labor,hrs,hrsAdj:hrs*cx,cx,laborAdj,cxAdj:laborAdj-labor,cont,exp,sub,disc,total,low,deposit:total*num(p.depositPct)/100}}
function actualHrs(l,cx){return (l.actual===''||l.actual==null)?r2(num(l.hours)*cx):num(l.actual)}
function calcBill(p){const E=calcEst(p),inv=p.invoice;const rows=[];let base=0;
 if(inv.mode==='actual'){p.lines.forEach(l=>{if(l.type==='exp'){const a=num(l.qty)*num(l.cost);rows.push({desc:l.desc,detail:`${fh(l.qty)} × ${money(l.cost)}`,amt:a});base+=a}else{const ah=actualHrs(l,E.cx),a=ah*num(l.rate);rows.push({desc:l.desc,detail:`${fh(ah)} hrs × ${money(l.rate)}/hr`,amt:a});base+=a}})}
 else{rows.push({desc:`${p.name||'Project'} — complete build per approved estimate / SOW`,detail:'Fixed price'+(E.disc?` · includes ${money(E.disc)} discount${p.discLabel?' ('+esc(p.discLabel)+')':''}`:''),amt:E.total});base=E.total}
 let co=0;const cos=inv.changeOrders.map(c=>{const a=num(c.hours)*num(c.rate);co+=a;return a});
 const credit=num(inv.credit),pre=base+co-credit,tax=pre*num(inv.tax)/100,total=pre+tax,paid=inv.payments.reduce((s,x)=>s+num(x.amount),0);
 const actHrs=p.lines.filter(l=>l.type!=='exp').reduce((s,l)=>s+actualHrs(l,E.cx),0);
 return{E,rows,base,co,cos,credit,tax,total,paid,balance:total-paid,actHrs,variance:base-(inv.mode==='actual'?E.total:base)}}
function calcMo(p){let price=0,cost=0;const items=p.monthly.items.map(it=>{const f=it.cycle==='yr'?1/12:1,pr=num(it.price)*f,c=num(it.cost)*f;price+=pr;cost+=c;return{pr,c,m:pr-c}});
 const margin=price-cost;return{items,price,cost,margin,pct:price?margin/price*100:0,annual:price*12,contract:price*(num(p.monthly.term)||12)}}
const LIC_TYPES=[['once','One-time'],['mo','Monthly'],['yr','Yearly'],['user','Per user / month'],['loc','Per location / month']];
const LIC_PRESETS=[
 ['Software license fee (one-time)','once',2500,1],['Annual license renewal','yr',600,1],['Monthly license fee','mo',99,1],
 ['Per-user license','user',15,5],['Per-location license','loc',49,1],['Setup / onboarding fee','once',500,1],
 ['Account administration fee','mo',25,1],['Data migration fee','once',750,1],['Training fee (per session)','once',150,1],
 ['White-label / custom branding fee','once',1000,1],['Source code escrow fee (yearly)','yr',300,1],['Reinstatement fee (after suspension)','once',150,1]];
function calcLic(p){const L=p.lic;let once=0,mo=0;const items=L.items.map(it=>{const a=num(it.amount)*(num(it.qty)||0);let m=0,o=0;
  if(it.type==='once')o=a;else if(it.type==='yr')m=a/12;else m=a;once+=o;mo+=m;return{o,m,a}});
 const admin=calcMo(p).cost*num(L.adminPct)/100;mo+=admin;const term=num(L.term)||12;
 return{items,once,admin,mo,annual:mo*12,firstYear:once+mo*Math.min(12,term),termTotal:once+mo*term,term}}
function calcMap(p){const E=calcEst(p),B=calcBill(p),M=calcMo(p),m={};
 E.lines.forEach((a,i)=>m['line.'+i]=money(a));
 Object.assign(m,{'est.labor':money(E.labor),'est.cxAdj':money(E.cxAdj),'est.cont':money(E.cont),'est.exp':money(E.exp),'est.disc':E.disc?'-'+money(E.disc):money(0),'est.total':money(E.total),'est.low':money(E.low),'est.hrs':fh(E.hrsAdj)+' hrs','est.deposit':money(E.deposit),'est.weeks':fh(E.hrsAdj/(num(S.settings.d.hpw)||25))+' wks'});
 p.lines.forEach((l,i)=>{if(l.type!=='exp'){const ah=actualHrs(l,E.cx);m['act.'+i]=money(ah*num(l.rate));m['acth.'+i]=fh(ah)}});
 B.cos.forEach((a,i)=>m['co.'+i]=money(a));
 Object.assign(m,{'bill.base':money(B.base),'bill.co':money(B.co),'bill.credit':B.credit?'-'+money(B.credit):money(0),'bill.tax':money(B.tax),'bill.total':money(B.total),'bill.paid':B.paid?'-'+money(B.paid):money(0),'bill.balance':money(B.balance),'bill.acthrs':fh(B.actHrs)+' hrs','bill.var':(B.base-E.total>=0?'+':'')+money(B.base-E.total)});
 M.items.forEach((x,i)=>{m['mo.pr.'+i]=money(x.pr)+'/mo';m['mo.m.'+i]=money(x.m)+'/mo'});
 Object.assign(m,{'mo.price':money(M.price),'mo.cost':money(M.cost),'mo.margin':money(M.margin),'mo.pct':fh(M.pct)+'%','mo.annual':money(M.annual),'mo.contract':money(M.contract)});
 const Lc=calcLic(p);Lc.items.forEach((x,i)=>m['lic.'+i]=x.o?money(x.o)+' one-time':money(x.m)+'/mo');Object.assign(m,{'lic.once':money(Lc.once),'lic.mo':money(Lc.mo),'lic.admin':money(Lc.admin),'lic.annual':money(Lc.annual),'lic.first':money(Lc.firstYear),'lic.termTotal':money(Lc.termTotal),'all.mo':money(Lc.mo+M.price)});
 const sched=p.sow.schedule.reduce((s,x)=>s+num(x.pct),0);m['sched.sum']=fh(sched)+'%';p.sow.schedule.forEach((x,i)=>m['sched.'+i]=money(E.total*num(x.pct)/100));
 return m}

/* ================= persistence ================= */
let DB=null,DL=null,readOnly=false,syncState='local',syncErr='';
const dirty=new Set(),timers={},inflight={},again={};
function persistLocal(){try{localStorage.setItem('devbill.v1',JSON.stringify({settings:S.settings,projects:S.projects}))}catch(e){}}
function loadLocal(){try{const r=JSON.parse(localStorage.getItem('devbill.v1')||'null');if(r){S.settings=mergeSettings(r.settings);S.projects=r.projects||{};Object.values(S.projects).forEach(fix)}}catch(e){}}
function queueSave(kind,id){persistLocal();const key=kind+':'+(id||'');dirty.add(key);clearTimeout(timers[key]);syncState='saving';setSync();timers[key]=setTimeout(()=>flush(kind,id),700)}
async function flush(kind,id){const key=kind+':'+(id||'');
 if(!DB){dirty.delete(key);syncState='local';setSync();return}
 if(inflight[key]){again[key]=true;return}
 inflight[key]=true;
 try{if(kind==='set')await DB.doc('settings/main').set(clone(S.settings));
  else if(kind==='del')await DB.doc('projects/'+id).delete();
  else if(S.projects[id])await DB.doc('projects/'+id).set(clone(S.projects[id]));
  syncState='cloud';syncErr=''}
 catch(e){syncState='err';syncErr=(e&&e.code)==='quota_exceeded'?'Storage is full — delete old projects.':(e&&e.code)==='invalid_argument'?'You have view-only access; changes stay on this device.':'Could not reach the cloud; saved on this device.';if(e&&e.code==='invalid_argument')readOnly=true}
 inflight[key]=false;
 if(again[key]){again[key]=false;flush(kind,id);return}
 dirty.delete(key);setSync()}
function setSync(){const sb=$('#navSave');if(sb){const d=dirty.size>0||syncState==='saving';sb.classList.toggle('dirty',d);sb.textContent=d?'💾 Save':'✓ Saved'}const el=$('#sync');if(!el)return;el.className='sync';
 if(syncState==='saving')el.textContent='Saving…';
 else if(syncState==='err'){el.textContent=syncErr;el.classList.add('err')}
 else if(syncState==='slow')el.textContent='Cloud not reachable yet — working from this device';
 else if(DB)el.textContent='✓ Saved to your account (syncs across devices)';
 else el.textContent='Saved on this device';}
function softRender(){const a=document.activeElement;if(a&&a.closest&&a.closest('#app')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;if(!$('#ov').classList.contains('hidden'))return;render()}
async function connect(){
 try{if(!window.claude||typeof claude.use!=='function'){setSync();return}
  claude.use('downloads').then(d=>{DL=d}).catch(()=>{});
  DB=await claude.use('db');
  if(!DB){setSync();return}
  setSync();
  let gotP=false;const timer=setTimeout(()=>{if(!gotP){syncState='slow';setSync()}},10000);
  DB.doc('settings/main').onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites||dirty.has('set:'))return;
    if(snap.exists){S.settings=mergeSettings(snap.data());persistLocal();updateBrand();softRender()}
    else if(!snap.metadata.fromCache){queueSave('set')}
  },e=>{syncState='err';syncErr='Cloud sync stopped; saved on this device.';setSync()});
  DB.collection('history').onSnapshot(snap=>{S.hist={};snap.docs.forEach(d=>{S.hist[d.id]=d.data()});softRender()},()=>{});
  DB.doc('meta/sync').onSnapshot(snap=>{S.histMeta=snap.exists?snap.data():null;softRender()},()=>{});
  DB.collection('projects').onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);if(syncState==='slow')syncState='cloud'}
    if(!gotP&&!snap.metadata.fromCache){gotP=true;
      let migrated=false;try{migrated=localStorage.getItem('devbill.migrated')==='1'}catch(e){}
      if(!migrated){const ids=new Set(snap.docs.map(d=>d.id));Object.keys(S.projects).forEach(id=>{if(!ids.has(id))queueSave('p',id)});try{localStorage.setItem('devbill.migrated','1')}catch(e){}}}
    snap.docChanges().forEach(ch=>{const id=ch.doc.id;if(dirty.has('p:'+id)||dirty.has('del:'+id)||ch.doc.metadata.hasPendingWrites)return;
      if(ch.type==='removed')delete S.projects[id];else S.projects[id]=fix(clone(ch.doc.data()))});
    if(S.view==='project'&&!S.projects[S.pid])S.view='home';
    persistLocal();setSync();softRender();
  },e=>{syncState='err';syncErr='Cloud sync stopped; saved on this device.';setSync()});
 }catch(e){setSync()}}

function noHist(){return `<div class="note">Build history hasn't loaded yet. It syncs from GitHub and Render into your account; ask Claude to "sync my build history" if it's empty.</div>`}
function rLinkCard(p){const has=Object.keys(S.hist).length;const t=trackStats(p);
 return `<div class="card"><h2>🔗 GitHub &amp; Render link</h2><div class="sm mut" style="margin-bottom:8px">Link this project to its repo(s). Tracked build time then flows into the Final Bill, and Render services into Monthly costs.</div>
 ${has?`<label class="f">Add a repo / app<select data-add="link"><option value="">+ Choose from your GitHub repos…</option>${histOpts(p.links)}</select></label>`:noHist()}
 <div class="row" style="margin-top:8px">${p.links.map(id=>chip(S.hist[id]?S.hist[id].name:id,'rmLink',id)).join('')}</div>
 ${t?`<div class="kpis" style="margin-top:10px"><div class="kpi"><div class="l">Tracked hours</div><div class="v">${fh(t.hours)}</div><div class="s">${t.sessions} sessions · ${t.commits} commits</div></div><div class="kpi"><div class="l">Billable (+${fh(t.allow)}%)</div><div class="v">${fh(t.billable)}</div><div class="s">${money0(t.billable*rate('dev'))} at dev rate</div></div><div class="kpi"><div class="l">Render</div><div class="v">${t.deploys}</div><div class="s">deploys · ${t.svs.length} service${t.svs.length==1?'':'s'}</div></div></div><div>${syncLine()}</div>`:''}</div>`}
function rReality(p){const E=calcEst(p),c=compStats(p),t=trackStats(p),has=Object.keys(S.hist).length;if(!has&&!p.comps.length)return '';
 let body='';
 if(c){const diff=E.hrsAdj?(E.hrsAdj-c.avg)/c.avg*100:0;const cls=Math.abs(diff)<=20?'ok':'';
  body+=`<div class="tot"><span>Your estimate</span><b>${fh(E.hrsAdj)} hrs</b></div><div class="tot"><span>Comparable builds (actual, incl. +${fh(S.settings.d.trackAllow)}%)</span><b>${fh(c.avg)} hrs avg</b></div><div class="tot"><span>Range of comparables</span><span>${fh(c.min)} – ${fh(c.max)} hrs</span></div>
  <div class="note ${cls}">${E.hrsAdj?(Math.abs(diff)<=20?`On target — within ${fh(Math.abs(diff))}% of what similar builds actually took.`:diff<0?`You're estimating ${fh(-diff)}% <b>under</b> what similar builds actually took. Consider raising hours or complexity.`:`You're estimating ${fh(diff)}% <b>over</b> similar builds. Fine if this one is bigger — otherwise you may be priced high.`):'Add labor items to compare.'}</div>
  <div class="row"><button class="btn sm" data-act="matchComps">Scale my hours to match (${fh(c.avg)} hrs)</button></div>`}
 if(t){const used=E.hrsAdj?t.billable/E.hrsAdj*100:0;body+=`<h3>This build so far (from GitHub)</h3><div class="tot"><span>Tracked + allowance</span><b>${fh(t.billable)} of ${fh(E.hrsAdj)} est. hrs (${fh(used)}%)</b></div>${used>100?'<div class="note">Over the estimate — consider a change order.</div>':''}`}
 return `<div class="card"><h2>📊 Reality check — from your GitHub history</h2>
  ${has?`<label class="f">Compare to past builds<select data-add="comp"><option value="">+ Pick a similar past app…</option>${histOpts(p.comps)}</select></label>`:noHist()}
  <div class="row" style="margin:8px 0">${p.comps.map(id=>chip(S.hist[id]?`${S.hist[id].name} (${fh(S.hist[id].hours)}h)`:id,'rmComp',id)).join('')}</div>${body}</div>`}
function rTracked(p){const t=trackStats(p);if(!t)return Object.keys(S.hist).length?`<div class="card"><h2>⏱ Tracked build time</h2><div class="sm mut">Link this project to its GitHub repo on the Client tab to bill from real build time.</div></div>`:'';
 return `<div class="card"><h2>⏱ Tracked build time (GitHub + Render)</h2>
  <div class="tot"><span>Hours from commit sessions</span><b>${fh(t.hours)} hrs</b></div>
  <div class="tot"><span>Off-commit allowance (+${fh(t.allow)}%: planning, testing, calls)</span><span>${fh(t.billable-t.hours)} hrs</span></div>
  <div class="tot big"><span>Billable tracked hours</span><span>${fh(t.billable)} hrs</span></div>
  <div class="tot"><span>Activity</span><span>${t.sessions} sessions · ${t.days} days · ${t.commits} commits · ${t.deploys} deploys</span></div>
  <div class="row" style="margin-top:10px"><button class="btn g" data-act="fillTracked">Fill actual hours from GitHub</button>${syncLine()}</div></div>`}
function rHist(){const hs=histList();if(!hs.length)return `<h1 style="margin-top:6px">Build History</h1>${noHist()}`;
 const allow=num(S.settings.d.trackAllow),dr=rate('dev');let H=0,D=0,M=0,C=0;hs.forEach(h=>{H+=num(h.hours);C+=num(h.commits);(h.services||[]).forEach(s=>{D+=num(s.deployCount);M+=svcCost(s)})});
 const band=[['Small','< 10 hrs',0,10],['Medium','10–40 hrs',10,40],['Large','40–100 hrs',40,100],['XL','100+ hrs',100,1e9]].map(([n,l,a,b])=>{const g=hs.filter(h=>h.hours>=a&&h.hours<b);return{n,l,c:g.length,avg:g.length?g.reduce((s,h)=>s+h.hours,0)/g.length:0}});
 const cal=Object.values(S.projects).map(p=>{const t=trackStats(p),E=calcEst(p);return t&&E.hrsAdj?{p,ratio:t.billable/E.hrsAdj}:null}).filter(Boolean);
 return `<div class="row" style="margin-top:6px"><h1 class="grow">Build History</h1>${syncLine()}</div>
 <div class="sm mut">Real build time from your GitHub commits (work sessions: commits less than 2 hrs apart, +30 min lead-in each) and Render deploys. Use it to price new builds and bill finished ones.</div>
 <div class="kpis"><div class="kpi"><div class="l">Apps tracked</div><div class="v">${hs.length}</div><div class="s">${C.toLocaleString()} commits</div></div>
 <div class="kpi"><div class="l">Build hours</div><div class="v">${fh(H)}</div><div class="s">${fh(H*(1+allow/100))} with +${fh(allow)}% allowance</div></div>
 <div class="kpi"><div class="l">Value at ${money0(dr)}/hr</div><div class="v">${money0(H*(1+allow/100)*dr)}</div><div class="s">if billed to a client</div></div>
 <div class="kpi"><div class="l">Render deploys</div><div class="v">${D.toLocaleString()}</div><div class="s">across all services</div></div>
 <div class="kpi"><div class="l">Render hosting</div><div class="v">${money0(M)}/mo</div><div class="s">web services, crons &amp; databases</div></div></div>
 <div class="card"><h2>What builds really take</h2><div class="grid">${band.map(b=>`<div class="kpi"><div class="l">${b.n} · ${b.l}</div><div class="v">${b.c?fh(b.avg)+' hrs':'—'}</div><div class="s">${b.c} app${b.c==1?'':'s'} · avg ${money0(b.avg*(1+allow/100)*dr)}</div></div>`).join('')}</div>
 ${cal.length?`<h3>Estimate accuracy (linked projects)</h3>${cal.map(x=>`<div class="tot"><span>${esc(x.p.name)}</span><b>${x.ratio>=1?'+':''}${fh((x.ratio-1)*100)}% vs estimate</b></div>`).join('')}`:''}</div>
 <div class="row"><input class="grow" style="flex:2 1 200px" placeholder="Search apps or repos…" data-ui="hq" value="${esc(S.hq)}"><select data-ui="hsort" style="flex:1 1 140px">${[['hours','Most hours'],['recent','Most recent'],['name','Name']].map(([v,l])=>`<option value="${v}" ${S.hsort===v?'selected':''}>${l}</option>`).join('')}</select></div>
 <div id="hlist">${rHistList()}</div>`}
function rHistList(){const allow=num(S.settings.d.trackAllow),dr=rate('dev');let hs=histList();const q=S.hq.toLowerCase();
 if(q)hs=hs.filter(h=>[h.name,h.repo,h.branch,...(h.services||[]).map(s=>s.name)].join(' ').toLowerCase().includes(q));
 hs.sort(S.hsort==='name'?(a,b)=>a.name.localeCompare(b.name):S.hsort==='recent'?(a,b)=>String(b.last).localeCompare(String(a.last)):(a,b)=>b.hours-a.hours);
 if(!hs.length)return '<div class="card empty">No matches.</div>';
 return hs.map(h=>{const svs=h.services||[],dep=svs.reduce((a,s)=>a+num(s.deployCount),0),mo=svs.reduce((a,s)=>a+svcCost(s),0);const used=Object.values(S.projects).filter(p=>p.links.includes(h.id)).map(p=>p.name);
 return `<div class="card pcard" data-act="histOpen" data-id="${esc(h.id)}"><div class="row"><div class="grow"><b style="font-size:16px">${esc(h.name)}</b><div class="mut sm">${esc(h.repo)}${h.branch&&h.branch!=='all'&&h.branch!=='default'?' · '+esc(h.branch)+' branch':''} · ${fmtDate(String(h.first).slice(0,10))} → ${fmtDate(String(h.last).slice(0,10))}</div></div>${used.length?`<span class="badge b-Sent">Linked</span>`:''}</div>
 <div class="nums"><div>Build hours<b>${fh(h.hours)}</b></div><div>Sessions / days<b>${h.sessions} / ${h.activeDays}</b></div><div>Commits<b>${h.commits}</b></div><div>Deploys<b>${dep}</b></div><div>Value<b>${money0(h.hours*(1+allow/100)*dr)}</b></div><div>Hosting<b>${money(mo)}/mo</b></div></div>
 <div id="hd-${esc(h.id)}" style="display:none;margin-top:10px">${svs.length?svs.map(s=>`<div class="line"><div class="row"><b class="grow">${esc(s.name)}</b><span class="badge">${esc(planLabel(s))}</span></div><div class="sm mut" style="margin-top:4px">${esc(s.workspace||'')} workspace · ${s.type==='postgres'?esc(s.status||''):`${num(s.deployCount)} deploys${s.failedCount?` (${s.failedCount} failed)`:''} ${num(s.buildMinutes)?` · ${fh(s.buildMinutes)} build min`:''}`} · ${money(svcCost(s))}/mo${s.firstDeploy?` · first deploy ${fmtDate(String(s.firstDeploy).slice(0,10))}`:''}</div>${s.expires?`<div class="note" style="margin:6px 0 0">Free database ${s.status&&s.status.startsWith('suspended')?'expired':'expires'} ${fmtDate(s.expires)} — upgrade to keep the data.</div>`:''}${s.url?`<div class="sm" style="margin-top:4px"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url.replace('https://',''))}</a></div>`:''}</div>`).join(''):'<div class="sm mut">No Render service found for this repo.</div>'}
 ${used.length?`<div class="sm mut">Linked to: ${used.map(esc).join(', ')}</div>`:''}</div></div>`}).join('')}

/* ================= render: settings ================= */
const SF=(lbl,k,v,type='text')=>`<label class="f">${lbl}<input type="${type}" data-s="${k}" value="${esc(v)}" ${type==='number'?'inputmode="decimal" step="any"':''}></label>`;
const ST=(lbl,k,v,rows=4)=>`<label class="f">${lbl}<textarea data-s="${k}" rows="${rows}">${esc(v)}</textarea></label>`;
function rSettings(){const s=S.settings,b=s.biz,d=s.d;
 return `<h1 style="margin-top:6px">Settings</h1>
 <div class="card"><h2>Your business (shows on every document)</h2><div class="grid g2">${SF('Business name','biz.name',b.name)}${SF('Your name','biz.owner',b.owner)}${SF('Email','biz.email',b.email,'email')}${SF('Phone','biz.phone',b.phone,'tel')}${SF('Website','biz.website',b.website)}</div>
  <div class="grid g2" style="margin-top:10px">${ST('Address','biz.address',b.address,3)}${ST('How to pay you (printed on invoices)','biz.payInfo',b.payInfo,3)}</div></div>
 <div class="card"><div class="row"><h2 class="grow" style="margin:0">Hourly rates</h2><button class="btn sm" data-act="addRate">+ Role</button></div>
  ${s.rates.map((r,i)=>`<div class="line"><div class="top"><input data-s="rates.${i}.name" value="${esc(r.name)}"><button class="x" data-act="rmRate" data-i="${i}">×</button></div><div class="grid" style="margin-top:8px">${SF('Rate ($/hr)',`rates.${i}.rate`,r.rate,'number')}</div></div>`).join('')}
  <div class="sm mut">New line items use these rates. Existing estimates keep the rate they were built with.</div></div>
 <div class="card"><h2>Defaults</h2><div class="grid">
  ${SF('Contingency %','d.contingency',d.contingency,'number')}${SF('Deposit %','d.deposit',d.deposit,'number')}${SF('Sales tax %','d.tax',d.tax,'number')}${SF('Payment terms (days)','d.terms',d.terms,'number')}
  ${SF('Monthly markup %','d.markup',d.markup,'number')}${SF('Build capacity (hrs/week)','d.hpw',d.hpw,'number')}${SF('Off-commit time allowance %','d.trackAllow',d.trackAllow,'number')}${SF('Warranty (days)','d.warranty',d.warranty,'number')}${SF('Estimate valid (days)','d.estValid',d.estValid,'number')}
  ${SF('Monthly cancel notice (days)','d.cancelDays',d.cancelDays,'number')}${SF('Company search: look near (city, state)','d.near',d.near)}${SF('Governing law (state)','d.law',d.law)}${SF('Venue (county, state)','d.venue',d.venue)}${SF('Default max license increase %','d.licCap',d.licCap,'number')}${SF('Late fee % / month','d.lateFee',d.lateFee,'number')}${SF('Invoice prefix','d.invPrefix',d.invPrefix)}${SF('Next invoice #','d.nextInv',d.nextInv,'number')}</div></div>
 <div class="card"><h2>Default SOW terms (for new projects)</h2><div class="sm mut" style="margin-bottom:8px">One item per line.</div>
  <div class="grid g2">${ST('Assumptions','assume',s.assume,5)}${ST('Client responsibilities','resp',s.resp,5)}</div><div style="margin-top:10px">${ST('Out of scope','oos',s.oos,5)}</div></div>
 <div class="card"><h2>Backup</h2><div class="sm mut">Copy a backup of all projects and settings, or paste one in to restore.</div>
  <div class="row" style="margin-top:8px"><button class="btn" data-act="export">Copy backup</button><button class="btn" data-act="importShow">Restore from backup</button></div><div id="impBox"></div></div>`}

/* ================= documents ================= */
function clientBlock(p){const c=p.client;return `<b>${esc(c.company||c.name||'—')}</b><div class="d-sm">${[c.company&&c.name?esc(c.name):'',escBr(c.address),esc(c.phone),esc(c.email),esc(c.website||'')].filter(Boolean).join('<br>')}</div>`}
function dHead(title,meta,p,lbl='Prepared for'){const b=S.settings.biz;
 return `<div class="d-top"><div><div class="d-biz">${esc(b.name)}</div><div class="d-sm">${[esc(b.owner),escBr(b.address),esc(b.phone),esc(b.email),esc(b.website)].filter(Boolean).join('<br>')}</div></div>
 <div class="d-right"><div class="d-title">${title}</div>${meta.filter(x=>x[1]).map(([k,v])=>`<div class="d-sm"><b>${k}:</b> ${esc(v)}</div>`).join('')}</div></div>
 <div class="d-to"><div class="d-lbl">${lbl}</div>${clientBlock(p)}</div>`}
const dRow=(desc,amt,detail='',cls='')=>`<div class="d-row ${cls}"><div>${desc}${detail?`<div class="d-sm">${detail}</div>`:''}</div><div class="d-amt">${amt}</div></div>`;
const ul=arr=>arr.length?`<ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<div class="d-sm">None.</div>';
function estNo(p){return 'EST-'+p.id.slice(0,6).toUpperCase()}
function breakdown(p,showAmt=true,showScope=false){const E=calcEst(p);return PHASES.map(ph=>{const ls=p.lines.map((l,i)=>[l,i]).filter(([l])=>(PHASES.includes(l.phase)?l.phase:'Other')===ph);if(!ls.length)return '';
 return `<div class="d-ph">${ph}</div>`+ls.map(([l,i])=>l.type==='exp'?dRow(esc(l.desc||'Expense'),showAmt?money(E.lines[i]):'',showAmt?`${fh(l.qty)} × ${money(l.cost)}`:''):dRow(esc(l.desc||'Item')+(showScope&&scopeOf(l)?`<div class="d-sm">${esc(scopeOf(l))}</div>`:''),showAmt?money(E.lines[i]*E.cx):'',showAmt?`${fh(num(l.hours)*E.cx)} hrs`:'')).join('')}).join('')}
function moBlock(p,title='Ongoing Monthly Services'){const M=calcMo(p);if(!p.monthly.items.length)return '';
 return `<h2>${title}</h2>${p.monthly.items.map((it,i)=>dRow(esc(it.name||'Service'),money(M.items[i].pr)+'/mo',it.cycle==='yr'?`${money(it.price)} billed yearly`:'')).join('')}
 <div class="d-tots">${dRow('<b>Monthly total</b>','<b>'+money(M.price)+'/mo</b>','','d-grand')}</div>`}
function timelineHtml(p){let wk=0;const tl=p.sow.timeline.filter(t=>t.label||num(t.weeks));if(!tl.length)return '<div class="d-sm">Timeline to be confirmed at kickoff.</div>';
 return tl.map(t=>{const w=num(t.weeks)||0,a=Math.floor(wk)+1,b=Math.max(a,Math.ceil(wk+w));wk+=w;return dRow(esc(t.label),w?`Week ${a}${b>a?'–'+b:''}`:'')}).join('')+`<div class="d-sm" style="margin-top:4px">Estimated duration: about ${fh(wk)} weeks${p.start?' starting '+fmtDate(p.start):' from kickoff'}${p.launch?' · target launch '+fmtDate(p.launch):''}.</div>`}
function buildDoc(kind,p){const s=S.settings,d=s.d,E=calcEst(p),B=calcBill(p),M=calcMo(p);let t,h,fn;
 if(kind==='estimate'){t='Estimate';fn=slug(p.name)+'-estimate';
  h=dHead('ESTIMATE',[['Estimate #',estNo(p)],['Date',fmtDate(p.estDate||iso())],['Valid until',fmtDate(addDays(p.estDate||iso(),d.estValid))]],p)+
  `<h2>${esc(p.name)}</h2>${p.desc?`<div>${escBr(p.desc)}</div>`:''}
  <h2>Work Breakdown</h2>${breakdown(p)||'<div class="d-sm">No items.</div>'}
  <div class="d-tots">${dRow('Development & design',money(E.laborAdj))}${E.cont?dRow(`Contingency (${fh(p.contingency)}%)`,money(E.cont)):''}${E.exp?dRow('Expenses / pass-through',money(E.exp)):''}${E.disc?dRow(`Discount${p.discLabel?' — '+esc(p.discLabel):''}${p.discType==='amt'?'':` (${fh(p.discount)}%)`}`,'-'+money(E.disc)):''}
  ${dRow('<b>Total estimate</b>','<b>'+money(E.total)+'</b>','','d-grand')}
  <div class="d-hl">${dRow('Deposit to start ('+fh(p.depositPct)+'%)','<b>'+money(E.deposit)+'</b>')}<div class="d-sm">Estimated ${fh(E.hrsAdj)} hours · about ${fh(E.hrsAdj/(num(d.hpw)||25))} weeks${E.cont?` · likely range ${money0(E.low)} – ${money0(E.total)}`:''}</div></div></div>
  ${moBlock(p,'Ongoing Monthly Costs (after launch)')}
  <div class="d-foot">This is an estimate, not a final bill. A Scope of Work will confirm deliverables, timeline and payment schedule before work begins.</div>`}
 else if(kind==='sow'){t='Scope of Work';fn=slug(p.name)+'-scope-of-work';let n=0;const H=x=>`<h2>${++n}. ${x}</h2>`;
  h=dHead('SCOPE OF WORK',[['Ref',estNo(p)],['Date',fmtDate(iso())]],p,'Client')+
  H('Project Overview')+`<div><b>${esc(p.name)}</b></div><div>${escBr(p.sow.overview||p.desc||'')}</div>`+
  H('Deliverables')+(breakdown(p,p.sow.showLine,true)||'<div class="d-sm">To be listed.</div>')+
  H('Timeline')+timelineHtml(p)+
  H('Investment')+`<div class="d-tots" style="max-width:none">${E.disc?dRow('Project price before discount',money(E.sub))+dRow(`Discount${p.discLabel?' — '+esc(p.discLabel):''}`,'-'+money(E.disc)):''}${dRow('<b>Total project price</b>','<b>'+money(E.total)+'</b>','','d-grand')}</div>
   <div class="d-lbl" style="margin-top:10px">Payment schedule</div>${p.sow.schedule.map(x=>dRow(esc(x.label)+` (${fh(x.pct)}%)`,money(E.total*num(x.pct)/100))).join('')}
   <div class="d-sm" style="margin-top:4px">Invoices are due within ${fh(d.terms)} days. Late balances may accrue ${fh(d.lateFee)}% per month.</div>`+
  (p.monthly.items.length?H('Ongoing Monthly Services')+moBlock(p,'').replace('<h2></h2>','')+`<div class="d-sm">Monthly services begin at launch${p.monthly.term?' for an initial term of '+fh(p.monthly.term)+' months':''}; either party may cancel with ${fh(d.cancelDays)} days' written notice after the initial term.</div>`:'')+
  H('Assumptions')+ul(lines2list(p.sow.assume))+H('Client Responsibilities')+ul(lines2list(p.sow.resp))+H('Out of Scope')+ul(lines2list(p.sow.oos))+
  H('Changes to Scope')+`<div>Requests outside this scope will be quoted as a written change order at ${money0(rate('dev'))}/hr (or a fixed price) and require approval before work begins. Change orders may adjust the timeline.</div>`+
  H('Acceptance & Warranty')+`<div>The client has 5 business days after delivery to report defects against this scope. Bugs reported within ${fh(d.warranty)} days of launch are fixed at no charge. New features and changes are billed as change orders. ${p.lic.model==='own'?'Upon final payment the client owns the custom code and data created for this project; third-party services remain under their own terms.':`${esc(s.biz.name)} retains all ownership of the software, code and intellectual property. The client owns its own data and receives the right to use the software under the separate Software License Agreement.`}</div>`+
  `<div class="d-sig"><div><div class="d-sigl"></div><b>${esc(s.biz.owner||'')}</b><div class="d-sm">${esc(s.biz.name)} · Date</div></div><div><div class="d-sigl"></div><b>${esc(p.client.name||'Client')}</b><div class="d-sm">${esc(p.client.company||'')} · Date</div></div></div>`}
 else if(kind==='invoice'){const inv=p.invoice;t='Invoice';fn=slug(p.name)+'-invoice'+(inv.number?'-'+slug(inv.number):'');
  h=dHead('INVOICE',[['Invoice #',inv.number||'—'],['Date',fmtDate(inv.date)],['Due',fmtDate(inv.due||addDays(inv.date,d.terms))],['Project',p.name]],p,'Bill to')+
  `<h2>Services</h2>${B.rows.map(r=>dRow(esc(r.desc),money(r.amt),r.detail)).join('')}
  ${inv.changeOrders.length?`<h2>Change Orders</h2>${inv.changeOrders.map((c,i)=>dRow(esc(c.desc||'Change order'),money(B.cos[i]),`${fh(c.hours)} hrs × ${money(c.rate)}/hr`)).join('')}`:''}
  <div class="d-tots">${dRow('Subtotal',money(B.base+B.co))}${B.credit?dRow('Credit / discount','-'+money(B.credit)):''}${B.tax?dRow(`Tax (${fh(inv.tax)}%)`,money(B.tax)):''}
  ${dRow('<b>Invoice total</b>','<b>'+money(B.total)+'</b>','','d-grand')}
  ${inv.payments.map(x=>dRow('Payment received'+(x.label?' — '+esc(x.label):''),'-'+money(x.amount),fmtDate(x.date))).join('')}
  <div class="d-hl">${dRow('<b>BALANCE DUE</b>','<b style="font-size:16px">'+money(B.balance)+'</b>')}</div></div>
  ${inv.notes?`<h2>Notes</h2><div>${escBr(inv.notes)}</div>`:''}

  const phs=PHASES.filter(ph=>lab.some(l=>(PHASES.includes(l.phase)?l.phase:'Other')===ph));const wks=E.hrsAdj/(num(S.settings.d.hpw)||25);
  const ov=`${p.desc?p.desc.trim()+'\n\n':''}${S.settings.biz.name} will design, build and launch ${p.name||'this app'} for ${p.client.company||p.client.name||'the client'}. The work covers ${lab.length} deliverable${lab.length==1?'':'s'} across ${phs.join(', ').toLowerCase()}, estimated at about ${fh(E.hrsAdj)} hours over roughly ${fh(Math.max(1,Math.ceil(wks*2)/2))} weeks, for a total of ${money(E.total)}.`;
  const mine=p.sow.overview&&p.sow.overview.trim()&&p.sow.overview!==p.sow.autoOv;if(!mine){p.sow.overview=p.sow.autoOv=ov}
  buildTimeline(p);
  const d=num(p.depositPct);const sch=p.sow.schedule;if(sch.length<=2){p.sow.schedule=[{label:'Deposit — due at signing',pct:d},{label:'Final payment — due at launch / acceptance',pct:100-d}]}else if(sch[0])sch[0].pct=d;
  touch(p);if(t&&t.dataset.go)S.tab='sow';render();scrollTo(0,0);toast(`SOW filled: ${mine?'overview kept (yours), ':'overview, '}${lab.length} deliverables, timeline, payments`)},
 autoTl(){const p=cur();if(!buildTimeline(p)){toast('Add labor items to the estimate first');return}touch(p);render()},
 _oldAutoTl(){const p=cur(),E=calcEst(p),hpw=num(S.settings.d.hpw)||25;
  p.sow.timeline=PHASES.map(ph=>{const h=p.lines.filter(l=>l.type!=='exp'&&(PHASES.includes(l.phase)?l.phase:'Other')===ph).reduce((s,l)=>s+num(l.hours)*E.cx,0);return h?{label:ph+(ph==='Launch'?' — testing, deploy & training':ph==='Build'?' — core features':ph==='Design'?' — mockups & approval':ph==='Discovery'?' — requirements & plan':''),weeks:Math.max(0.5,Math.ceil(h/hpw*2)/2)}:null}).filter(Boolean);
  if(!p.sow.timeline.length){toast('Add labor items to the estimate first');return}touch(p);render()},
 addSched(){const p=cur();p.sow.schedule.push({label:'Milestone payment',pct:0});touch(p);render()},
 rmSched(t){const p=cur();p.sow.schedule.splice(+t.dataset.i,1);touch(p);render()},
 sched3(){const p=cur();p.sow.schedule=[{label:'Deposit — due at signing',pct:40},{label:'Design approval / mid-build',pct:30},{label:'Final payment — due at launch / acceptance',pct:30}];p.depositPct=40;touch(p);render()},
 assignInv(){const p=cur(),d=S.settings.d;p.invoice.number=(d.invPrefix||'')+num(d.nextInv);d.nextInv=num(d.nextInv)+1;queueSave('set');touch(p);render()},
 addCO(){const p=cur();p.invoice.changeOrders.push({desc:'',hours:'',rate:rate('dev')});touch(p);render()},
 rmCO(t){const p=cur();p.invoice.changeOrders.splice(+t.dataset.i,1);touch(p);render()},
 addPay(){const p=cur();p.invoice.payments.push({date:iso(),label:'',amount:''});touch(p);render()},
 addDep(){const p=cur();p.invoice.payments.push({date:iso(),label:'Deposit',amount:r2(calcEst(p).deposit)});touch(p);render()},
 rmPay(t){const p=cur();p.invoice.payments.splice(+t.dataset.i,1);touch(p);render()},
 addMo(){const p=cur();p.monthly.items.push({name:'',cat:'Other',cycle:'mo',cost:'',price:''});touch(p);render()},
 rmMo(t){const p=cur();p.monthly.items.splice(+t.dataset.i,1);touch(p);render()},
 markupAll(){const p=cur(),mk=num(p.monthly.markup);p.monthly.items.forEach(it=>{if(num(it.cost))it.price=r2(num(it.cost)*(1+mk/100))});touch(p);render();toast('Markup applied to items with a cost')},
 doc(t){openDoc(t.dataset.kind)},
 closeOv(){closeOv()},
 pdf(){makePdf()},
 html(){saveFile(curDoc.fn+'.html',fullHtml())},
 async copyTxt(){const txt=$('#paper').innerText;try{await navigator.clipboard.writeText(txt);toast('Copied')}catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied')}catch(_){toast('Copy blocked')}ta.remove()}},
 addRate(){S.settings.rates.push({id:uid(),name:'New role',rate:100});queueSave('set');render()},
 rmRate(t){if(S.settings.rates.length<=1){toast('Keep at least one rate');return}S.settings.rates.splice(+t.dataset.i,1);queueSave('set');render()},
 async export(){const txt=JSON.stringify({app:'devbill',v:1,at:new Date().toISOString(),settings:S.settings,projects:S.projects});
  $('#impBox').innerHTML=`<textarea class="copybox" readonly style="margin-top:8px">${esc(txt)}</textarea>`;
  try{await navigator.clipboard.writeText(txt);toast('Backup copied — paste it somewhere safe')}catch(e){$('#impBox textarea').select();toast('Select the text above and copy it')}},
 importShow(){$('#impBox').innerHTML=`<textarea class="copybox" id="impTxt" placeholder="Paste backup here" style="margin-top:8px"></textarea><div class="row" style="margin-top:8px"><button class="btn p" data-act="importGo">Restore (merges projects)</button></div>`},
 importGo(){try{const o=JSON.parse($('#impTxt').value);if(!o||o.app!=='devbill')throw 0;if(o.settings){S.settings=mergeSettings(o.settings);queueSave('set')}
  Object.values(o.projects||{}).forEach(p=>{S.projects[p.id]=fix(p);queueSave('p',p.id)});render();toast('Restored')}catch(e){toast('That doesn’t look like a Dev Billing backup')}}
};
document.addEventListener('click',e=>{if(e.target.closest('a[href]'))return;const t=e.target.closest('[data-act]');if(!t)return;const a=ACT[t.dataset.act];if(a){e.preventDefault();a(t)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').classList.contains('hidden'))closeOv()});
function readVal(t){if(t.type==='checkbox')return t.checked;if(t.type==='number'||t.dataset.num!==undefined)return t.value===''?'':parseFloat(t.value);return t.value}
const app=$('#app');
app.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.ui){S[t.dataset.ui]=t.value;if(t.dataset.ui==='hq'||t.dataset.ui==='hsort'){$('#hlist').innerHTML=rHistList()}else $('#plist').innerHTML=rList();return}
 if(t.dataset.k){if(t.type==='radio'&&!t.checked)return;const p=cur();setPath(p,t.dataset.k,readVal(t));touch(p);updateCalc()}
 else if(t.dataset.s){setPath(S.settings,t.dataset.s,readVal(t));queueSave('set');if(t.dataset.s==='biz.name')updateBrand()}});
app.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.role!==undefined){const p=cur(),l=p.lines[+t.dataset.role];l.rateId=t.value;l.rate=rate(t.value);touch(p);render()}
 else if(t.dataset.add==='module'&&t.value!==''){const m=MODS[+t.value],p=cur();t.value='';(async()=>{if(hasLine(p,m[1])&&!await askConfirm('Already added','<b>'+esc(m[1])+'</b> is already in this estimate. Add it a second time?','Yes, add again'))return;addLine(p,{id:uid(),type:'labor',phase:m[0],desc:m[1],hours:m[2],rateId:m[3],rate:rate(m[3])});toast('Added: '+m[1])})()}
 else if(t.dataset.add==='mo'&&t.value!==''){const x=MO_PRESETS[+t.value],p=cur(),mk=num(p.monthly.markup);let price;t.value='';(async()=>{if(hasMo(p,x[0])&&!await askConfirm('Already added','<b>'+esc(x[0])+'</b> is already on the monthly plan. Add it a second time?','Yes, add again'))return;
  if(x[4]==='mk')price=r2(x[2]*(1+mk/100));else if(x[4]==='ret2')price=2*rate('dev');else if(x[4]==='ret5')price=5*rate('dev');else price=x[4];
  p.monthly.items.push({name:x[0],cat:x[1],cycle:x[3],cost:x[2],price});touch(p);render();toast('Added: '+x[0])})()}
 else if(t.dataset.add==='lic'&&t.value!==''){const x=LIC_PRESETS[+t.value],p=cur();t.value='';(async()=>{if(hasLic(p,x[0])&&!await askConfirm('Already added','<b>'+esc(x[0])+'</b> is already on this license. Add it a second time?','Yes, add again'))return;p.lic.items.push({name:x[0],type:x[1],amount:x[2],qty:x[3]});touch(p);render();toast('Added: '+x[0])})()}
 else if(t.dataset.add==='link'&&t.value){const p=cur();if(!p.links.includes(t.value))p.links.push(t.value);const r=fillFromGit(p,false);touch(p);render();if(r)toast(r)}
 else if(t.dataset.add==='comp'&&t.value){const p=cur();if(!p.comps.includes(t.value))p.comps.push(t.value);touch(p);render()}
 else if(t.dataset.rr!==undefined){render()}
 else if(t.dataset.k&&t.type==='number'){updateCalc()}});

/* ================= save / refresh / pull-to-refresh ================= */
async function saveAll(){const keys=[...dirty];keys.forEach(k=>clearTimeout(timers[k]));
 await Promise.all(keys.map(k=>{const i=k.indexOf(':');return flush(k.slice(0,i),k.slice(i+1)||undefined)}));persistLocal();setSync()}
let refreshing=false;
async function doRefresh(){if(refreshing)return;refreshing=true;const b=$('#navRef');if(b)b.textContent='⟳ …';
 try{await saveAll();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  if(typeof window.__dbRefresh==='function'){await window.__dbRefresh();render();toast('✓ Up to date')}
  else{location.reload();return}}catch(e){toast('Could not refresh — check your connection')}
 refreshing=false;if(b)b.textContent='⟳ Refresh'}
(function(){let y0=null,pull=0;const ptr=()=>$('#ptr');
 addEventListener('touchstart',e=>{y0=(scrollY<=0&&$('#ov').classList.contains('hidden'))?e.touches[0].clientY:null;pull=0},{passive:true});
 addEventListener('touchmove',e=>{if(y0==null)return;pull=e.touches[0].clientY-y0;if(pull>0&&scrollY<=0){const d=Math.min(pull*0.5,70);ptr().style.transform=`translate(-50%,${d-50}px)`;ptr().style.opacity=d>15?1:0;ptr().textContent=pull>110?'↻ Release to refresh':'↓ Pull to refresh'}},{passive:true});
 addEventListener('touchend',()=>{if(y0==null)return;const go=pull>110;y0=null;pull=0;if(go){ptr().textContent='Refreshing…';doRefresh().then(()=>{ptr().style.transform='translate(-50%,-60px)';ptr().style.opacity=0})}else{ptr().style.transform='translate(-50%,-60px)';ptr().style.opacity=0}},{passive:true});})();
addEventListener('beforeunload',e=>{if(dirty.size){saveAll();e.preventDefault();e.returnValue=''}});

if(window.__RENDER_HOST&&'serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
if(matchMedia('(display-mode: standalone)').matches)addEventListener('DOMContentLoaded',()=>{const b=document.getElementById('navApp');if(b)b.style.display='none'});
/* ================= boot ================= */
loadLocal();render();setSync();connect();
</script>
