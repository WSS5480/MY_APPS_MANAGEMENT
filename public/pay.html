<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My account</title><meta name="theme-color" content="#0f1b2d">
<style>body{margin:0;background:#f3f5f8;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#132033}.w{max-width:440px;margin:0 auto;padding:20px}
.c{background:#fff;border:1px solid #e1e6ee;border-radius:14px;padding:18px;margin-bottom:12px}h1{font-size:22px;margin:4px 0 14px}label{display:block;font-size:13px;font-weight:700;color:#62708a;margin:10px 0 4px}
input{width:100%;box-sizing:border-box;font-size:17px;padding:11px;border:1px solid #cdd5e1;border-radius:10px}button,.b{display:block;width:100%;box-sizing:border-box;text-align:center;margin-top:14px;padding:13px;border:none;border-radius:10px;background:#1b5cff;color:#fff;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #e1e6ee}.kv span{color:#62708a}.kv b{text-align:right}.big{font-size:30px;font-weight:800}.e{color:#c42b2b;margin-top:10px}.late{color:#c42b2b}</style></head>
<body><div class="w"><h1 id="t">Check my account</h1><div id="box" class="c"><form id="f"><label>Account number</label><input id="a" inputmode="numeric" required><label>Last name</label><input id="l" autocomplete="family-name" required><button>Look up</button><div class="e" id="e"></div></form></div></div>
<script>
const $=s=>document.querySelector(s),m=n=>'$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),d=x=>x?new Date(x+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('#f').onsubmit=async e=>{e.preventDefault();$('#e').textContent='';const r=await fetch('/api/public/account',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account:$('#a').value,last:$('#l').value})});const j=await r.json();if(!r.ok){$('#e').textContent=j.error;return}
$('#t').textContent='Hi '+j.name;const due=j.pastDue>0?j.pastDue:j.payment;
$('#box').innerHTML=`<div class="kv"><span>${esc(j.dealer)}</span><b>#${esc(j.account)}</b></div><div class="kv"><span>Vehicle</span><b>${esc(j.vehicle)}</b></div>
<p style="margin:16px 0 4px;color:#62708a">${j.pastDue>0?'<span class="late">Past due now</span>':'Next payment'}</p><div class="big ${j.pastDue>0?'late':''}">${m(due)}</div><p style="margin:2px 0 12px;color:#62708a">${j.pastDue>0?(j.daysLate+' days late'):'Due '+d(j.nextDue)}</p>
<div class="kv"><span>Regular payment</span><b>${m(j.payment)} ${esc(j.frequency)}</b></div><div class="kv"><span>Balance</span><b>${m(j.balance)}</b></div><div class="kv"><span>Payoff today</span><b>${m(j.payoff)}</b></div><div class="kv"><span>Last payment</span><b>${d(j.lastPaid)}</b></div>
${j.pay_link?`<a class="b" href="${esc(j.pay_link)}" target="_blank" rel="noopener">Pay online</a>`:''}${j.phone?`<a class="b" style="background:#e7ecf4;color:#132033" href="tel:${esc(String(j.phone).replace(/[^\d+]/g,''))}">Call to pay ${esc(j.phone)}</a>`:''}
<h3 style="margin:18px 0 6px;font-size:14px;color:#62708a">Recent payments</h3>${j.history.map(p=>`<div class="kv"><span>${d(p.date)} · ${esc(p.method)}</span><b>${m(p.amount)}</b></div>`).join('')||'<p style="color:#62708a">None yet.</p>'}`;};
</script></body></html>
