<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dealer System — Sign in</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><meta name="theme-color" content="#0f1b2d">
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1b2d;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
form{background:#fff;border-radius:14px;padding:28px;width:min(340px,90vw);box-shadow:0 10px 40px rgba(0,0,0,.35)}h1{margin:0 0 4px;font-size:20px}p{margin:0 0 18px;color:#62708a;font-size:14px}
input{width:100%;box-sizing:border-box;font-size:22px;letter-spacing:6px;text-align:center;padding:12px;border:1px solid #cdd5e1;border-radius:10px}
button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:10px;background:#1b5cff;color:#fff;font-size:16px;font-weight:700;cursor:pointer}#e{color:#c42b2b;font-size:14px;margin-top:10px;text-align:center;min-height:18px}
a{display:block;text-align:center;margin-top:14px;color:#1b5cff;font-size:14px;text-decoration:none}</style></head>
<body><form id="f"><h1>Dealer System</h1><p id="msg">Enter your PIN</p><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" autofocus required><button id="btn">Sign in</button><div id="e"></div><a href="/pay">Customers: check your balance →</a></form>
<script>
const $=id=>document.getElementById(id);let ticket=null;
$('f').onsubmit=async e=>{e.preventDefault();$('e').textContent='';
  const r=ticket?await fetch('/login/code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticket,code:$('pin').value})})
                :await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('pin').value})});
  const j=await r.json().catch(()=>({}));
  if(r.ok&&j.need_code){ticket=j.ticket;$('pin').value='';$('pin').type='text';$('pin').autocomplete='one-time-code';$('msg').textContent='Enter the code we texted to '+j.to;$('btn').textContent='Verify';$('pin').focus();return}
  if(r.ok){location.href='/';return}
  if(ticket&&r.status!==401){ticket=null;$('pin').type='password';$('msg').textContent='Enter your PIN';$('btn').textContent='Sign in'}
  $('e').textContent=j.error||'Could not sign in';};
</script></body></html>
